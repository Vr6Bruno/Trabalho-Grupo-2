<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estok - Novo Suprimento</title>
    <link rel="stylesheet" href="novo_suprimento.css">
</head>

<body>
    <!-- MENU LATERAL: mostrar só as abas que o perfil atual pode acessar.
        Aba da página atual recebe a classe "ativo". Preencher os href. -->
    <nav class="navegador">
        <h1 class="titulo">Estok</h1>
        <ul class="box_lista">
            <li class="lista"><a class="botao" href="">Solicitações</a></li>
            <li class="lista"><a class="botao ativo" href="suprimentos.html">Suprimentos</a></li>
            <li class="lista"><a class="botao" href="">Estoque</a></li>
            <li class="lista"><a class="botao" href="">Pedidos</a></li>
        </ul>
    </nav>

    <div class="bloco_conteudo">
        <!-- CABEÇALHO: dados do usuário logado. Preencher nome, entidade e perfil em uso. -->
        <header class="cabecalho">
            <div class="usuario">
                <span id="usuario_nome">Nome do Usuário</span>
                <span><span id="usuario_entidade">Entidade</span> / <span id="usuario_perfil">Perfil</span></span>
            </div>
            <div class="avatar"></div>
        </header>

        <main class="principal">
            <!-- Mesma tela serve para criar e editar: no editar, trocar o título
                 por "Editar Suprimento" e preencher os campos com os valores atuais. -->
            <h2>Novo Suprimento</h2>

            <!-- FORMULÁRIO: o "name" de cada campo é o parâmetro enviado ao back.
                 Definir action (rota de cadastro). -->
            <form class="formulario" method="post" action="">

                <div class="secoes">
                    <section class="secao">
                        <h3>Identificação</h3>
                        <div class="campos">
                            <!-- Único campo obrigatório -->
                            <label class="campo">
                                <span>Nome <span class="obrigatorio">*</span></span>
                                <input type="text" name="nome" required>
                            </label>
                            <label class="campo">Código interno
                                <input type="text" name="codigo_interno">
                            </label>
                            <!-- Status: 1 = ativo (padrão), 0 = inativo -->
                            <label class="campo">Status
                                <select name="status">
                                    <option value="1">Ativo</option>
                                    <option value="0">Inativo</option>
                                </select>
                            </label>
                            <label class="campo">Unidade de medida
                                <input type="text" name="unidade_medida">
                            </label>
                            <label class="campo largo">Descrição
                                <textarea name="descricao" rows="4"></textarea>
                            </label>
                        </div>
                    </section>

                    <section class="secao">
                        <h3>Estoque</h3>
                        <div class="campos">
                            <!-- Se vier vazio, o back deve salvar como 0 -->
                            <label class="campo">Estoque mínimo
                                <input type="number" name="estoque_minimo" min="0" value="0">
                                <small>Alerta ao atingir este valor</small>
                            </label>
                            <!-- Somente exibição (não é campo do formulário).
                                 No cadastro é sempre 0; na edição, o back preenche o valor e a unidade. -->
                            <div class="campo">
                                <span>Estoque atual</span>
                                <div class="estoque_atual">
                                    <strong>0</strong>
                                    <small>-</small>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Cancelar: preencher href com a tela de Suprimentos. Salvar envia o formulário. -->
                <div class="acoes">
                    <a class="botao botao_destaque" href="suprimentos.html">Cancelar</a>
                    <button type="submit" class="botao botao_primario">Salvar</button>
                </div>

            </form>
        </main>
    </div>

</body>

</html>
