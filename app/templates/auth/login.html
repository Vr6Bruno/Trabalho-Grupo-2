<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estok - Acessar o Sistema</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <div class="login_container">
        <div class="login_card">
            <div class="login_topo">
                <span class="login_logo">Estok</span>
                <h2>Gestão de Recursos</h2>
                <p>Identifique-se para acessar o ambiente</p>
            </div>

            {% if erro %}
            <div class="login_erro">
                {{ erro }}
            </div>
            {% endif %}

            <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                <div class="form_grupo">
                    <label for="login">Login</label>
                    <input type="text" id="login" name="login" value="{{ login_informado or '' }}" placeholder="Ex: admin, gerente..." required autofocus>
                </div>

                <div class="form_grupo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn_entrar">Entrar</button>
            </form>

            <div class="login_rodape">
                <span>Estok — Plataforma de Gerenciamento de Recursos</span>
            </div>
        </div>
    </div>
</body>

</html>
